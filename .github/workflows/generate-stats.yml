name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Each card is rendered twice because the SVG bakes in `text_color`; the
      # README picks between them with <picture media="(prefers-color-scheme: ...)">.
      # The dark and light options must stay identical apart from `text_color`.
      #
      # `include_all_commits=true` switches the commit count to the search API,
      # which counts commits in every private repository the PAT can read.
      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&title_color=248A7E&icon_color=5B623C&bg_color=00000000&hide_border=true&hide_title=true&text_color=ffffff
          path: profile/stats-dark.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&title_color=248A7E&icon_color=5B623C&bg_color=00000000&hide_border=true&hide_title=true&text_color=000000
          path: profile/stats-light.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&title_color=248A7E&icon_color=5B623C&bg_color=00000000&hide_border=true&hide_title=true&text_color=ffffff
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&title_color=248A7E&icon_color=5B623C&bg_color=00000000&hide_border=true&hide_title=true&text_color=000000
          path: profile/top-langs-light.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          git commit -m "Update README cards" || exit 0
          git push
